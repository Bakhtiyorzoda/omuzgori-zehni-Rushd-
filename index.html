<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Омӯзгори Зеҳнӣ</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #f0f4f8; color: #1e293b; }
    header { background: #0f172a; color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
    .lang-switch button { background: #334155; color: white; border: none; padding: 6px 9px; border-radius: 6px; margin-left: 4px; }
    .lang-switch button.active { background: #2563eb; font-weight: bold; }
    main { max-width: 680px; margin: 14px auto; padding: 0 12px; }
    .card { background: white; padding: 14px; border-radius: 12px; margin-bottom: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    h2 { margin: 0 0 10px 0; font-size: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .btn { padding: 10px 6px; border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 8px; font-weight: 600; }
    .btn.active { background: #2563eb; color: white; }
    .chat { height: 220px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; margin-bottom: 10px; background: #f8fafc; }
    .msg { padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; max-width: 88%; line-height: 1.4; }
    .bot { background: #e0e7ff; }
    .user { background: #2563eb; color: white; margin-left: auto; }
    .row { display: flex; gap: 6px; }
    input { flex: 1; min-width: 0; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; }
    .send { background: #16a34a; color: white; border: none; padding: 10px 14px; border-radius: 8px; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <b>🎓 Омӯзгори Зеҳнӣ</b>
    <div class="lang-switch">
      <button onclick="setL('tg')" id="tg" class="active">ТҶ</button>
      <button onclick="setL('ru')" id="ru">РУ</button>
      <button onclick="setL('en')" id="en">EN</button>
    </div>
  </header>
  <main>
    <div class="card">
      <h2 id="gt">Синфро интихоб кунед (1–11):</h2>
      <div class="grid" id="grades"></div>
    </div>
    <div class="card" id="subCard" style="display:none;">
      <h2 id="st">Фанро интихоб кунед:</h2>
      <div class="grid" id="subs"></div>
    </div>
    <div class="card">
      <div class="chat" id="chat"><div class="msg bot" id="wm">Салом! Дилхоҳ саволро нависед (бо интернет ва бе интернет кор мекунад).</div></div>
      <div class="row">
        <input id="inp" placeholder="Масалан: Қувва чист?">
        <button class="send" onclick="ask()" id="sb">Фиристодан</button>
      </div>
    </div>
  </main>
  <script>
    let L = 'tg', G = null;
    const T = {
      tg: { gt: "Синфро интихоб кунед (1–11):", st: "Фанро интихоб кунед:", wm: "Салом! Дилхоҳ саволро нависед.", sb: "Фиристодан", gw: "Синфи", s: ["Математика", "Забон", "Физика", "Химия", "Биология", "Таърих"] },
      ru: { gt: "Выберите класс (1–11):", st: "Выберите предмет:", wm: "Привет! Задайте любой вопрос.", sb: "Отправить", gw: "Класс", s: ["Математика", "Язык", "Физика", "Химия", "Биология", "История"] },
      en: { gt: "Select Grade (1–11):", st: "Select Subject:", wm: "Hello! Ask any question.", sb: "Send", gw: "Grade", s: ["Math", "Language", "Physics", "Chemistry", "Biology", "History"] }
    };
    const KB = {
      "қувва": "Қувва — ченаки таъсири мутақобилаи ҷисмҳо ба ҳамдигар мебошад. Воҳидаш Нютон (Н), формулааш: F = m · a.",
      "паранд": "Парандагон — ҳайвоноти муҳрадори гармхунеанд, ки баданашон бо пар пӯшида шудааст ва бол доранд.",
      "атом": "Атом — хурдтарин заррачаи модда аст, ки аз ядро ва электронҳо иборат мебошад.",
      "пифагор": "Теоремаи Пифагор: Дар секунҷаи росткунҷа a² + b² = c² аст.",
      "об": "Формулаи химиявии об H₂O аст."
    };
    let DB = JSON.parse(localStorage.getItem('oz_db') || '{}');

    function draw() {
      let h = '';
      for (let i = 1; i <= 11; i++) h += `<button class="btn ${G==i?'active':''}" onclick="pickG(${i})">${T[L].gw} ${i}</button>`;
      document.getElementById('grades').innerHTML = h;
    }
    function pickG(n) {
      G = n; draw();
      document.getElementById('subCard').style.display = 'block';
      document.getElementById('subs').innerHTML = T[L].s.map(x => `<button class="btn" onclick="addM('✅ ${T[L].gw} ${n} — ${x}','bot')">${x}</button>`).join('');
    }
    function setL(l) {
      L = l; ['tg','ru','en'].forEach(x => document.getElementById(x).classList.toggle('active', x==l));
      ['gt','st','wm','sb'].forEach(k => document.getElementById(k).innerText = T[l][k]);
      draw(); if (G) pickG(G);
    }
    function addM(t, w) {
      const c = document.getElementById('chat');
      c.innerHTML += `<div class="msg ${w}">${t}</div>`; c.scrollTop = c.scrollHeight;
    }
    async function ask() {
      const i = document.getElementById('inp'), q = i.value.trim();
      if (!q) return; addM(q, 'user'); i.value = '';
      const low = q.toLowerCase();
      for (let k in DB) if (low.includes(k)) return addM(DB[k], 'bot');
      for (let k in KB) if (low.includes(k)) return addM(KB[k], 'bot');
      if (navigator.onLine) {
        const clean = q.replace(/(чист|кист|что такое|what is|\?)/gi, '').trim();
        try {
          const r = await fetch(`https://${L}.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(clean)}&format=json&origin=*`);
          const d = await r.json();
          if (d.query?.search?.[0]) {
            const r2 = await fetch(`https://${L}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(d.query.search[0].title)}`);
            const d2 = await r2.json();
            if (d2.extract) { DB[clean.toLowerCase()] = d2.extract; localStorage.setItem('oz_db', JSON.stringify(DB)); return addM(d2.extract, 'bot'); }
          }
        } catch (e) {}
      }
      addM("📴 Дар хотираи офлайн ёфт нашуд. Бо интернет пурсед — барнома онро меёбад ва барои бе интернет сабт мекунад!", 'bot');
    }
    draw();
  </script>
</body>
</html>
